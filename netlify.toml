[build]
  command = "npm run build --workspace @secure-spreadsheet/shared && npm run build --workspace @secure-spreadsheet/frontend"
  publish = "apps/frontend/dist"

[build.environment]
  NODE_VERSION = "24.21.0"
  VITE_API_BASE_URL = "https://excelseguro.duckdns.org/api"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://excelseguro.duckdns.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
