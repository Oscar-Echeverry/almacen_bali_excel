server {
    listen 80;
    server_name excelseguro.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name excelseguro.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/excelseguro.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/excelseguro.duckdns.org/privkey.pem;

    ssl_client_certificate /opt/secure-spreadsheet/secrets/device-ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Client-DN $ssl_client_s_dn;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store, private" always;
    }

    location /health {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3000/api/health;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        default_type text/plain;
        return 200 "Secure Spreadsheet API\n";
    }

    location / {
        return 404;
    }
}
